<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0a0e0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tempapp">
  <title>Tempapp</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.5/dist/cdn.min.js"></script>
</head>
<body>
  <div class="app" x-data="timer">

    <section x-show="screen === 'config'" x-transition class="screen-config">
      <div class="config-header">
        <div class="wordmark">tempapp</div>
        <h1>Configurar entreno</h1>
      </div>

      <div class="type-selector">
        <button type="button" :class="workoutType === 'series' ? 'active' : ''" @click="workoutType = 'series'; renderConfigPreview()">Serie</button>
        <button type="button" :class="workoutType === 'repeater' ? 'active' : ''" @click="workoutType = 'repeater'; renderConfigPreview()">Repeater</button>
      </div>

      <div class="card" x-show="workoutType === 'series'">
        <div class="card-label">Campos &middot; Serie</div>
        <div class="config-form">
          <label>
            <span class="field-name">Preparación inicial (s)</span>
            <input type="number" min="0" step="1" x-model.number="seriesInitialPrep" @input="renderConfigPreview()">
          </label>
          <label>
            <span class="field-name">Trabajo (s)</span>
            <input type="number" min="0" step="1" x-model.number="seriesWork" @input="renderConfigPreview()">
          </label>
          <label>
            <span class="field-name">Descanso (s)</span>
            <input type="number" min="0" step="1" x-model.number="seriesRest" @input="renderConfigPreview()">
          </label>
          <label>
            <span class="field-name">Preparación de descanso (s)</span>
            <input type="number" min="0" step="1" x-model.number="seriesRestPrep" @input="renderConfigPreview()">
          </label>
          <label>
            <span class="field-name">Rondas</span>
            <input type="number" min="0" step="1" x-model.number="seriesRounds" @input="renderConfigPreview()">
          </label>
        </div>
      </div>

      <div class="card" x-show="workoutType === 'repeater'">
        <div class="card-label">Campos &middot; Repeater</div>
        <div class="config-form">
          <label>
            <span class="field-name">Preparación inicial (s)</span>
            <input type="number" min="0" step="1" x-model.number="repeaterInitialPrep" @input="renderConfigPreview()">
          </label>
          <label>
            <span class="field-name">Trabajo (s)</span>
            <input type="number" min="0" step="1" x-model.number="repeaterWork" @input="renderConfigPreview()">
          </label>
          <label>
            <span class="field-name">Descanso (s)</span>
            <input type="number" min="0" step="1" x-model.number="repeaterRest" @input="renderConfigPreview()">
          </label>
          <label>
            <span class="field-name">Repeticiones del ciclo</span>
            <input type="number" min="0" step="1" x-model.number="repeaterCycleRounds" @input="renderConfigPreview()">
          </label>
          <label>
            <span class="field-name">Descanso entre sets (s)</span>
            <input type="number" min="0" step="1" x-model.number="repeaterBetweenRest" @input="renderConfigPreview()">
          </label>
          <label>
            <span class="field-name">Preparación del descanso entre sets (s)</span>
            <input type="number" min="0" step="1" x-model.number="repeaterBetweenRestPrep" @input="renderConfigPreview()">
          </label>
          <label>
            <span class="field-name">Sets</span>
            <input type="number" min="0" step="1" x-model.number="repeaterSets" @input="renderConfigPreview()">
          </label>
        </div>
      </div>

      <div class="card preview-card">
        <div class="card-label">Vista previa de la estructura</div>
        <div class="tree" x-ref="configPreview"></div>
      </div>

      <p class="form-error" x-show="formError" x-text="formError"></p>

      <button type="button" class="start-btn" @click="start()">Empezar</button>
    </section>

    <section x-show="screen === 'running'" x-transition class="screen-running">
      <div class="stage" :data-phase="phaseType">
        <button type="button" class="sound-toggle-btn" @click="toggleSound()" x-text="soundOn ? '🔊' : '🔇'" aria-label="Silenciar sonido"></button>
        <div class="eyebrow" x-text="phaseLabel"></div>

        <div class="ring-wrap">
          <svg viewBox="0 0 120 120">
            <circle class="ring-track" cx="60" cy="60" r="54"></circle>
            <circle class="ring-progress" x-ref="ring" cx="60" cy="60" r="54"
              stroke-dasharray="339.3" :style="{ strokeDashoffset: ringOffset }"></circle>
          </svg>
          <div class="countdown" x-text="remainingLabel"></div>
        </div>

        <div class="position" x-show="positionBlockText">
          <span x-text="positionBlockText"></span>
          <template x-if="positionSectorText"><span> &middot; </span></template>
          <span x-text="positionSectorText"></span>
        </div>

        <div class="next-hint" x-show="hasNext" :style="'--dot-color: var(--' + nextType + ')'">
          <span class="dot"></span>
          Siguiente: <b x-text="nextLabel"></b>&nbsp;&middot; <span x-text="nextDurationLabel"></span>
        </div>
      </div>

      <div class="segments-wrap">
        <div class="segments-label">Progreso del entreno</div>
        <div class="segments" x-ref="segments"></div>
      </div>

      <button type="button" class="pause-btn" @click="pause()">Pausar</button>
    </section>

    <section x-show="screen === 'paused'" x-transition>
      <p>Pausado</p>
      <button type="button" @click="resumeTimer()">Reanudar</button>
      <button type="button" @click="reset()">Reiniciar</button>
    </section>

    <section x-show="screen === 'done'" x-transition>
      <p>¡Entreno completado!</p>
      <button type="button" @click="reset()">Volver a configurar</button>
    </section>

  </div>
</body>
</html>
