<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tempapp">
  <title>Tempapp</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.5/dist/cdn.min.js"></script>
</head>
<body>
  <div x-data="timer">

    <section x-show="screen === 'config'" x-transition>
      <p>Configurar entreno</p>
      <button type="button" @click="start()">Empezar</button>
    </section>

    <section x-show="screen === 'running'" x-transition>
      <p x-text="phaseLabel"></p>
      <p class="time" x-text="remainingLabel"></p>
      <button type="button" @click="pause()">Pausar</button>
    </section>

    <section x-show="screen === 'paused'" x-transition>
      <p>Pausado</p>
      <button type="button" @click="resumeTimer()">Reanudar</button>
      <button type="button" @click="reset()">Reiniciar</button>
    </section>

    <section x-show="screen === 'done'" x-transition>
      <p>¡Entreno completado!</p>
      <button type="button" @click="reset()">Volver a configurar</button>
    </section>

  </div>
</body>
</html>
