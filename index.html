<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tempapp">
  <title>Tempapp</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.5/dist/cdn.min.js"></script>
</head>
<body>
  <div x-data="timer">

    <section x-show="screen === 'config'" x-transition>
      <p>Configurar entreno</p>

      <div class="type-selector">
        <button type="button" :class="workoutType === 'series' ? 'active' : ''" @click="workoutType = 'series'">Serie</button>
        <button type="button" :class="workoutType === 'repeater' ? 'active' : ''" @click="workoutType = 'repeater'">Repeater</button>
      </div>

      <div class="config-form" x-show="workoutType === 'series'">
        <label>
          Preparación inicial (s)
          <input type="number" min="0" step="1" x-model.number="seriesInitialPrep">
        </label>
        <label>
          Trabajo (s)
          <input type="number" min="0" step="1" x-model.number="seriesWork">
        </label>
        <label>
          Descanso (s)
          <input type="number" min="0" step="1" x-model.number="seriesRest">
        </label>
        <label>
          Preparación de descanso (s)
          <input type="number" min="0" step="1" x-model.number="seriesRestPrep">
        </label>
        <label>
          Rondas
          <input type="number" min="0" step="1" x-model.number="seriesRounds">
        </label>
      </div>

      <div class="config-form" x-show="workoutType === 'repeater'">
        <label>
          Preparación inicial (s)
          <input type="number" min="0" step="1" x-model.number="repeaterInitialPrep">
        </label>
        <label>
          Trabajo (s)
          <input type="number" min="0" step="1" x-model.number="repeaterWork">
        </label>
        <label>
          Descanso (s)
          <input type="number" min="0" step="1" x-model.number="repeaterRest">
        </label>
        <label>
          Repeticiones del ciclo
          <input type="number" min="0" step="1" x-model.number="repeaterCycleRounds">
        </label>
        <label>
          Descanso entre sets (s)
          <input type="number" min="0" step="1" x-model.number="repeaterBetweenRest">
        </label>
        <label>
          Preparación del descanso entre sets (s)
          <input type="number" min="0" step="1" x-model.number="repeaterBetweenRestPrep">
        </label>
        <label>
          Sets
          <input type="number" min="0" step="1" x-model.number="repeaterSets">
        </label>
      </div>

      <p class="form-error" x-show="formError" x-text="formError"></p>

      <button type="button" @click="start()">Empezar</button>
    </section>

    <section x-show="screen === 'running'" x-transition class="screen-running">
      <div class="stage" :data-phase="phaseType">
        <div class="eyebrow" x-text="phaseLabel"></div>

        <div class="ring-wrap">
          <svg viewBox="0 0 120 120">
            <circle class="ring-track" cx="60" cy="60" r="54"></circle>
            <circle class="ring-progress" x-ref="ring" cx="60" cy="60" r="54"
              stroke-dasharray="339.3" :style="{ strokeDashoffset: ringOffset }"></circle>
          </svg>
          <div class="countdown" x-text="remainingLabel"></div>
        </div>

        <div class="position" x-show="positionBlockText">
          <span x-text="positionBlockText"></span>
          <template x-if="positionSectorText"><span> &middot; </span></template>
          <span x-text="positionSectorText"></span>
        </div>

        <div class="next-hint" x-show="hasNext" :style="'--dot-color: var(--' + nextType + ')'">
          <span class="dot"></span>
          Siguiente: <b x-text="nextLabel"></b>&nbsp;&middot; <span x-text="nextDurationLabel"></span>
        </div>
      </div>

      <div class="segments-wrap">
        <div class="segments-label">Progreso del entreno</div>
        <div class="segments" x-ref="segments"></div>
      </div>

      <button type="button" class="pause-btn" @click="pause()">Pausar</button>
    </section>

    <section x-show="screen === 'paused'" x-transition>
      <p>Pausado</p>
      <button type="button" @click="resumeTimer()">Reanudar</button>
      <button type="button" @click="reset()">Reiniciar</button>
    </section>

    <section x-show="screen === 'done'" x-transition>
      <p>¡Entreno completado!</p>
      <button type="button" @click="reset()">Volver a configurar</button>
    </section>

  </div>
</body>
</html>
